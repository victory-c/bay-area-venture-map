name: Refresh firms data

# Re-run the SEC Form ADV scraper monthly and commit a fresh firms.json.
# Vercel auto-redeploys on push, so the live site picks up the new data
# with no further action.
#
# SEC publishes the bulk Investment Adviser dataset around the 1st of each
# month. We run on the 5th to give them a few days to finalise.

on:
  schedule:
    - cron: "0 6 5 * *"     # 5th of each month, 06:00 UTC
  workflow_dispatch: {}     # also allow manual trigger from the Actions tab

permissions:
  contents: write           # needed to push the refresh branch
  pull-requests: write      # needed to open the refresh PR

concurrency:
  group: refresh-firms
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run scraper
        # SEC 403s a User-Agent with no email contact. Set the repository
        # variable SCRAPER_CONTACT to an address you monitor; without it the
        # scraper falls back to an unreachable placeholder.
        env:
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
        run: uv run python -m scraper.build --enrich sec_bulk

      - name: Sanity-check output
        run: |
          set -euo pipefail
          # Compare against the committed payload, not just a row count: the
          # 2026-06-05 refresh kept ~678 rows while silently dropping every
          # enrichment column, and a count-only gate waved it through.
          git show HEAD:data/firms.json > /tmp/firms-previous.json
          uv run python -m scraper.check_refresh data/firms.json /tmp/firms-previous.json

      - name: Open refresh pull request
        # main requires passing checks and a PR, so this no longer pushes to
        # main directly. It opens a PR instead.
        #
        # One manual step per run: GitHub holds workflow runs on PRs created
        # with GITHUB_TOKEN until someone clicks "Approve and run" on the PR's
        # Checks tab. Until that click the required checks sit pending and the
        # PR cannot merge — that is expected, not a failure.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/firms.json site/firms.json; then
            echo "No changes — nothing to refresh"
            exit 0
          fi

          stamp="$(date -u +%Y-%m-%d)"
          branch="data/sec-refresh-${stamp}"

          git config user.name  "firms-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/firms.json site/firms.json
          git commit -m "data: monthly SEC refresh (${stamp})"
          # --force so a same-day manual re-run updates the existing branch
          # rather than failing. The branch is bot-owned and date-stamped, so
          # nothing human is ever overwritten.
          git push --force -u origin "$branch"

          # --state open matters: `gh pr view <branch>` matches a PR in ANY
          # state, so a previously closed PR on this branch name made the job
          # skip creating a new one and strand the branch with no PR.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $branch — pushed an update to it"
            exit 0
          fi

          gh pr create --base main --head "$branch" \
            --title "data: monthly SEC refresh (${stamp})" \
            --body "Automated monthly refresh of the SEC Form ADV bulk data.

          Generated by \`refresh-firms.yml\` (run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).
          The payload passed \`scraper.check_refresh\` against the previous
          \`data/firms.json\`, which compares enrichment columns rather than
          just row counts.

          **Checks need one click to start.** GitHub holds workflow runs on
          PRs opened with \`GITHUB_TOKEN\`; open the Checks tab and choose
          \"Approve and run\" to let the secret scan and tests report."
