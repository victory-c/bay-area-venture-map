[project]
name = "sand-hill-vcs"
version = "0.1.0"
description = "Founder-facing reference: interactive map + table of Sand Hill Road / Menlo Park VC firms."
authors = [{ name = "victory-c", email = "victorchun@berkeley.edu" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
