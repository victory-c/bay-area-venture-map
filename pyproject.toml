[project]
name = "sand-hill-vcs"
version = "0.1.0"
description = "Founder-facing reference: interactive map + table of Sand Hill Road / Menlo Park VC firms."
authors = [{ name = "victory-c", email = "victorchun@berkeley.edu" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Deliberately scoped to correctness and real code smells. The cosmetic
# modernisation rules (UP, I) flag ~74 further sites across 17 files; those
# belong in their own reformat PR, not mixed into unrelated changes.
select = ["F", "E4", "E7", "E9", "B", "SIM", "PIE", "PERF", "PLW", "BLE", "RUF"]
# E702: `x = y; changed = True` is consistent, deliberate style across 16 sites
# in this codebase. Splitting those lines is `ruff format`'s call, not a gate's.
ignore = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
